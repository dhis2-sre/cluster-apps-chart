# Default values for cluster-apps.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

ingress-nginx:
  enabled: true
  controller:
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
    config:
      use-proxy-protocol: true
      real-ip-header: proxy_protocol
    ingressClassResource:
      default: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: cluster-apps

cert-manager:
  enabled: true
  installCRDs: true

cert-issuer-prod:
  email: devops@dhis2.org
  server: https://acme-v02.api.letsencrypt.org/directory
  # Unsetting the ingressClass value, in order to use default ingress class.
  ingressClass: ""

metrics-server:
  enabled: true

kube-prometheus-stack:
  enabled: true
  grafana:
    persistence:
      enabled: true
      size: 20Gi
      finalizers:
        - kubernetes.io/pvc-protection
    ingress:
      enabled: true
      hosts:
        - grafana.im.dhis2.org
      annotations:
        cert-manager.io/cluster-issuer: cert-issuer-prod
        ingress.kubernetes.io/ssl-redirect: "true"
      tls:
        - secretName: grafana-im-dhis2-org-tls
          hosts:
            - grafana.im.dhis2.org
    adminUser: admin
    adminPassword: # Leave empty for autogenerated password
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://{{ .Release.Name }}-loki:3100
  prometheus:
    prometheusSpec:
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false

loki:
  enabled: true
  loki:
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    pattern_ingester:
      enabled: true
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 720h
    compactor:
      retention_enabled: true
      delete_request_store: s3
    ruler:
      enable_api: true
    auth_enabled: false
  minio:
    enabled: true
    persistence:
      size: 50Gi
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    persistence:
      size: 30Gi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

promtail:
  enabled: true
  config:
    clients:
      - url: http://{{ .Release.Name }}-loki:3100/loki/api/v1/push

    snippets:
      extraRelabelConfigs:
        - source_labels: [__meta_kubernetes_pod_label_im_deployment_id]
          target_label: im_deployment_id
        - source_labels: [__meta_kubernetes_pod_label_im_type]
          target_label: im_type

k8s-monitoring:
  enabled: false
  cluster:
    name: ""
  destinations: {}
  podLogsViaLoki:
    labels:
      app: app.kubernetes.io/name
      instance: app.kubernetes.io/instance
      im_deployment_id: im-deployment-id
      im_type: im-type
